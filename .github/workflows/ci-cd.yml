name: cloud-native-devops-workflow
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    env: 
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-api
    steps:

      - name: checkout
        uses: actions/checkout@v4

      - name: set docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker.hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${{ github.sha }} \
            -f ./src/Dockerfile \
            ./src

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.64.1_Linux-64bit.deb
          sudo dpkg -i trivy_0.64.1_Linux-64bit.deb

      - name: Scan Docker Image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            $IMAGE_NAME:latest

      - name: Push Latest Image
        run: docker push $IMAGE_NAME:latest

      - name: Push Commit Image
        run: docker push $IMAGE_NAME:${{ github.sha}}