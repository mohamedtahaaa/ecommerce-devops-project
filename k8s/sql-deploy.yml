apiVersion: apps/v1
kind: Deployment 
metadata:
  name: sql-deploy
  namespace: ecommerce
  labels:
    app: sql 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql
  template:
    metadata:
      labels:
        app: sql
    spec:
      containers:
        - name: sql-pod
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom: 
                secretKeyRef:
                  name: sqlserver-secret
                  key: MSSQL_SA_PASSWORD
          
          volumeMounts:
            - name: sql-volume
              mountPath: /var/opt/mssql
      
      volumes:
        - name: sql-volume
          persistentVolumeClaim:
            claimName: ecommerce-sql-pvc