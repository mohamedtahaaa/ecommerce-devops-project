apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: Ingress
  namespace: ecommerce
spec:
  ingressClassName: nginx
  rules:
    - host: ecommerce.local
      http:
        path: /
        pathType: Prefix
        backend: 
          service:
            name: ecommerce-svc
            port:
              number: 80